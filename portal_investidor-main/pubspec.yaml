name: portal_investidor
description: "Portal do Investidor - Clever Option"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Utilitários principais
  http: ^1.6.0
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  url_launcher: ^6.3.2
  shimmer: ^3.0.0
  local_auth: ^3.0.1
  # Guarda as fotografias em disco. Sem isto, cada regresso ao ecra volta a
  # descarregar a mesma imagem pelos dados moveis do investidor.
  cached_network_image: ^3.4.1
  # O token JWT nao pode ficar em SharedPreferences, que e um ficheiro XML
  # em claro. Isto poe-no no Keystore (Android) ou no Keychain (iOS).
  flutter_secure_storage: ^9.2.4
  
  # UI e utilitários
  cupertino_icons: ^1.0.8
  
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.1   # 🔧 Splash screen (agora no local correto)
  flutter_launcher_icons: ^0.14.4

# Ícone da app: o símbolo do C, a branco sobre o navy. As imagens saem do
# logótipo em vetor com `loja/gerar.ps1`, e os tamanhos todos da app com
# `dart run flutter_launcher_icons`. Ver assets/icon/LEIA-ME.md.
flutter_launcher_icons:
  # Já com o navy de fundo: é o que o iOS usa (não aceita transparência) e o
  # ícone dos Android anteriores ao 8.
  image_path: "assets/icon/icone.png"
  android: "ic_launcher"
  # Android 8 em diante: fundo e frente separados, porque o sistema recorta o
  # ícone numa forma diferente em cada telemóvel. A frente é só o símbolo, com
  # folga, para não perder as pontas no recorte.
  adaptive_icon_background: "#002847"
  adaptive_icon_foreground: "assets/icon/icone_frente.png"
  # Sem margem extra: a folga já vem desenhada na imagem. Por omissão o
  # gerador acrescenta 16% de cada lado, e as duas juntas deixavam o C com um
  # terço do ícone.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true

# ⬇️⬇️⬇️ SPLASH SCREEN (fora da secção "flutter", ao mesmo nível) ⬇️⬇️⬇️
flutter_native_splash:
  color: "#002847"
  image: assets/images/logo.png
  android: true
  ios: true

# ⬇️⬇️⬇️ CONFIGURAÇÃO FLUTTER (assets, fonts, etc.) ⬇️⬇️⬇️
flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/simbolo_mapa.png

  fonts:
    - family: MonaSans
      fonts:
        - asset: assets/fonts/MonaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/MonaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MonaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MonaSans-Bold.ttf
          weight: 700